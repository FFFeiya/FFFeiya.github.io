<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="P4 Review Bot workflow">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #d5d1c8; stroke-width: 1.5; }
      .title { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111111; }
      .desc { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b675f; }
      .arrow { stroke: #9a958b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9a958b"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="#ffffff"/>

  <g>
    <rect x="40" y="210" width="180" height="86" rx="10" class="box"/>
    <text x="60" y="244" class="title">Perforce</text>
    <text x="60" y="270" class="desc">p4 changes</text>
  </g>

  <line x1="220" y1="253" x2="290" y2="253" class="arrow"/>

  <g>
    <rect x="290" y="200" width="210" height="106" rx="10" class="box"/>
    <text x="310" y="234" class="title">P4Poller.ps1</text>
    <text x="310" y="260" class="desc">读取描述 / 文件 / diff</text>
    <text x="310" y="282" class="desc">加载规则并评估</text>
  </g>

  <line x1="395" y1="200" x2="395" y2="140" class="arrow"/>
  <line x1="395" y1="140" x2="560" y2="140" class="arrow"/>
  <line x1="560" y1="140" x2="560" y2="200" class="arrow"/>

  <g>
    <rect x="500" y="200" width="190" height="106" rx="10" class="box"/>
    <text x="520" y="234" class="title">TechDoc.rules.yaml</text>
    <text x="520" y="260" class="desc">submission</text>
    <text x="520" y="282" class="desc">naming / organization</text>
  </g>

  <line x1="500" y1="253" x2="430" y2="253" class="arrow"/>

  <g>
    <rect x="760" y="210" width="170" height="86" rx="10" class="box"/>
    <text x="780" y="244" class="title">Discord</text>
    <text x="780" y="270" class="desc">分级通知</text>
  </g>

  <line x1="690" y1="253" x2="760" y2="253" class="arrow"/>

  <g>
    <rect x="290" y="360" width="210" height="80" rx="10" class="box"/>
    <text x="310" y="392" class="title">review-last.json</text>
    <text x="310" y="418" class="desc">结构化审查结果</text>
  </g>

  <line x1="395" y1="306" x2="395" y2="360" class="arrow"/>
</svg>
