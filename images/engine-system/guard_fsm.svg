<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#f8fafc"/>
  <text x="40" y="48" font-size="22" font-weight="700" fill="#0f172a">guard.fsm</text>
  <text x="40" y="74" font-size="14" fill="#64748b">States, transitions and conditions from the Lua file</text>

  <!-- initial marker -->
  <circle cx="70" cy="215" r="8" fill="#0f172a"/>
  <line x1="78" y1="215" x2="118" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- states -->
  <g font-size="18" font-weight="600" text-anchor="middle">
    <rect x="120" y="185" width="140" height="60" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="190" y="221" fill="#075985">Patrol</text>
    <rect x="390" y="185" width="140" height="60" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="460" y="221" fill="#92400e">Chase</text>
    <rect x="620" y="185" width="140" height="60" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="690" y="221" fill="#991b1b">Attack</text>
    <rect x="390" y="355" width="140" height="60" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="460" y="391" fill="#5b21b6">Flee</text>
  </g>

  <g fill="none" stroke="#475569" stroke-width="2">
    <!-- Patrol -> Chase -->
    <path d="M260,203 L388,203" marker-end="url(#arrow)"/>
    <!-- Chase -> Patrol -->
    <path d="M390,228 L262,228" marker-end="url(#arrow)"/>
    <!-- Chase -> Attack -->
    <path d="M530,203 L618,203" marker-end="url(#arrow)"/>
    <!-- Attack -> Chase -->
    <path d="M620,228 L532,228" marker-end="url(#arrow)"/>
    <!-- any state -> Flee -->
    <path d="M460,300 L460,353" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  </g>

  <g font-size="13" fill="#334155" text-anchor="middle">
    <text x="324" y="192">canSeePlayer or wasHit</text>
    <text x="324" y="250">!canSeePlayer for 3 s</text>
    <text x="574" y="192">dist &lt; 2</text>
    <text x="574" y="250">dist &gt; 2.5</text>
  </g>

  <rect x="350" y="280" width="220" height="24" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="460" y="297" font-size="13" text-anchor="middle" fill="#475569">any state: health &lt; 20</text>
</svg>
